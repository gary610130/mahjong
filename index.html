        <input class="input" id="name${i}" data-draft="name" data-i="${i}" list="peopleList" value="${esc(n)}" placeholder="名字" autocomplete="off"></label>
      <input class="input" id="mate${i}" data-draft="mate" data-i="${i}" list="peopleList" value="${esc(d.mates[i])}" placeholder="隊友（選填，會換手的話）" autocomplete="off" aria-label="${W[i]}位的隊友">
    </div>`).join('');
  const opts = [0, 1, 2, 3].map((i) => `<option value="${i}"${d.startDealer === i ? ' selected' : ''}>${W[i]}位${d.names[i] ? '（' + esc(d.names[i]) + '）' : ''}</option>`).join('');
  return `<section class="panel"><h2>開一場新的</h2>
    <form class="form" id="setup">
      ${games.length ? `<div class="links" style="justify-content:flex-start">
        <button type="button" class="link" data-act="fillLast">帶入上一場的座位</button>
        <button type="button" class="link" data-act="clearNames">清空名字</button></div>` : ''}
      <div class="names">${seatForms}</div>${peopleList()}
      <p class="hint">照抽到的風位填，東、南、西、北就是出牌順序。打字時會跳出以前用過的名字可以直接點。組隊的話，先上場的人填在名字，隊友填在下面；錢照位子一起算，個人戰績另外記。</p>
      <label class="field"><span class="label">開打地點（選填）</span>
        <input class="input" id="location" data-draft="location" list="locList" value="${esc(d.location)}" placeholder="例如：阿明家" autocomplete="off"></label>
      ${locList()}
      <label class="field"><span class="label">誰先當莊（擲骰子算到的人）</span><select class="input" id="startDealer" data-draft="startDealer">${opts}</select></label>
      <div class="two">
        <label class="field"><span class="label">底（元）</span><input class="input num" id="base" data-draft="base" type="number" inputmode="numeric" min="0" value="${d.base}"></label>
        <label class="field"><span class="label">每台（元）</span><input class="input num" id="perTai" data-draft="perTai" type="number" inputmode="numeric" min="0" value="${d.perTai}"></label>
      </div>
      <label class="toggle"><input type="checkbox" id="tsumoTai" data-draft="tsumoTai"${d.tsumoTai ? ' checked' : ''}>
        <span>自摸自動加 1 台<br><span class="hint">打開後，台數只要填牌面的台，自摸那 1 台 App 會自己加</span></span></label>
      <label class="toggle"><input type="checkbox" id="dealerTai" data-draft="dealerTai"${d.dealerTai ? ' checked' : ''}>
        <span>莊家台：跟莊家有關的那筆帳多算 1 台<br><span class="hint">莊家胡、莊家放槍、別人自摸時莊家要付的那份</span></span></label>
      <label class="toggle"><input type="checkbox" id="drawStreak" data-draft="drawStreak"${d.drawStreak ? ' checked' : ''}>
        <span>流局時連莊數加 1<br><span class="hint">關掉的話，流局只續莊，連莊數不變</span></span></label>
      <p class="hint">連莊：莊家胡一把變連 1，連 n 時跟莊家有關的帳加 2n 台（連 n 拉 n）。籌碼以每人 1000 元起算。</p>
      ${ui.error ? `<p class="error" role="alert">${esc(ui.error)}</p>` : ''}
      <button type="submit" class="primary">開始</button>
    </form></section>`;
}

// 上一場最後的座位（含隊友），開新一場時預先帶入
MJ.replayLineupSeats = (g) => { const ls = MJ.lineupsOf(g); return ls[ls.length - 1].seats; };

// ---------- 匯出：一把一列，Excel 打得開 ----------
function buildCsv() {
  const cell = (v) => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const kind = { ron: '放槍', tsumo: '自摸', draw: '流局', triple: '一炮三響' };
  const head = ['日期', '地點', '開打時間', '第幾把', '記錄時間', '圈局', '莊家', '連莊', '結果', '胡牌', '放槍', '台數'];
  for (let i = 0; i < 4; i++) head.push(W[i] + '位', W[i] + '位輸贏');
  const lines = [head];
  games.slice().sort((a, b) => startOf(a) - startOf(b)).forEach((g) => {
    const r = MJ.replay(g);
    const d = new Date(startOf(g));
    const date = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    r.rows.forEach((row) => {
      const h = row.hand;
      const nm = row.names;
      const winCol = h.type === 'draw' ? '' : h.type === 'triple' ? [0, 1, 2, 3].filter((p) => p !== h.loser).map((p) => nm[p]).join('／') : nm[h.winner];
      const taiCol = h.type === 'draw' ? '' : h.type === 'triple' ? [0, 1, 2, 3].filter((p) => p !== h.loser).map((p) => (h.tais && h.tais[p]) || 0).join('／') : h.tai + selfExtra(g, h.type);
      const line = [date, g.location || '', clock(startOf(g)), row.no, h.t ? clock(h.t) : '',
        MJ.roundLabel(row.before.rotation), nm[row.before.dealer], row.before.streak, kind[h.type],
        winCol, h.type === 'ron' || h.type === 'triple' ? nm[h.loser] : '', taiCol];
      for (let p = 0; p < 4; p++) line.push(nm[p], row.delta[p]);
      lines.push(line);
    });
  });
  return '\uFEFF' + lines.map((l) => l.map(cell).join(',')).join('\r\n');
}

function exportCsv() {
  const d = new Date();
  const blob = new Blob([buildCsv()], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `麻將帳本-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  ui.flash = '已匯出';
  render();
}

async function copyLink() {
  const el = document.getElementById('roomLink');
  try { await navigator.clipboard.writeText(roomLink()); } catch (e) { el.select(); document.execCommand('copy'); }
  ui.copied = true;
  render();
  setTimeout(() => { ui.copied = false; if (ui.tab === 'history') render(); }, 2500);
}

// ---------- 操作 ----------
let armTimer = null;
function setArmed(key) {
  ui.armed = key;
  clearTimeout(armTimer);
  if (key) armTimer = setTimeout(() => { ui.armed = null; render(); }, 4000);
}

function doArmed(key) {
  const g = activeGame();
  if (key === 'end' && g) {
    const ng = clone(g); ng.endedAt = Date.now(); saveGame(ng);
    ui.viewId = g.id;
  } else if (key === 'delhand' && ui.edit) {
    const back = ui.edit.fromTable;
    const vg = viewedGame();
    const ng = MJ.removeHand(withLineups(vg), ui.edit.index);
    saveGame(ng);
    ui.flash = `已刪除第 ${ui.edit.index + 1} 把`;
    ui.edit = null;
    if (back) ui.tab = 'table';
  } else if (key.startsWith('del:')) {
    const id = key.slice(4);
    removeGame(id);
    if (ui.viewId === id) ui.viewId = null;
  }
}

function saveSeats() {
  const g = activeGame();
  const sp = ui.seatPanel;
  const r = MJ.replay(g);
  const ng = withLineups(g);
  let seats;
  let restart = false;
  let dealer = r.state.dealer;
  if (sp.mode === 'swap') {
    seats = clone(sp.seats);
    const used = new Set(seats.flatMap((s) => s.members));
    for (let p = 0; p < 4; p++) {
      const nn = (sp.newNames[p] || '').trim();
      if (!nn) continue;
      if (seats[p].members.includes(nn)) { seats[p].on = seats[p].members.indexOf(nn); continue; }
      if (used.has(nn)) {
        // 掛名在別隊、沒在上場的隊友可以換過來；他之前打的錢留在原本那隊
        const q = seats.findIndex((s) => s.members.includes(nn));
        const from = seats[q];
        if (from.members[from.on] === nn) { ui.error = `「${nn}」現在正在${W[q]}位上場，要先讓他下場才能換過來。`; return false; }
        if (from.members[0] === nn) { ui.error = `「${nn}」是${W[q]}位那一隊的主要成員，不能換到別隊。`; return false; }
        const k = from.members.indexOf(nn);
        from.members.splice(k, 1);
        if (k < from.on) from.on -= 1;
        used.delete(nn);
      }
      seats[p].members.push(nn);
      seats[p].on = seats[p].members.length - 1;
      used.add(nn);
    }
  } else {
    if (new Set(sp.order).size < 4) { ui.error = '每一隊只能坐一個位子，請檢查有沒有選重複。'; return false; }
    seats = sp.order.map((j) => clone(r.lineup.seats[j]));
    restart = true;
    dealer = sp.dealer;
  }
  const at = g.hands.length;
  const last = ng.lineups[ng.lineups.length - 1];
  const entry = { from: at, restart, dealer, seats };
  // 這段還沒打任何一把就再改，直接蓋掉，不留一段空的
  if (last.from === at && ng.lineups.length > 1) {
    entry.restart = last.restart || restart;
    if (!restart) entry.dealer = last.dealer;
    ng.lineups[ng.lineups.length - 1] = entry;
  } else if (last.from === at) {
    ng.lineups[0] = Object.assign(entry, { restart: true, dealer: restart ? dealer : last.dealer });
  } else {
    ng.lineups.push(entry);
  }
  saveGame(ng);
  ui.flash = sp.mode === 'swap' ? '已換手' : '已換位子，從東風東局重新開始';
  return true;
}

document.addEventListener('click', (ev) => {
  const tabBtn = ev.target.closest('#tabs button');
  const btn = tabBtn || ev.target.closest('[data-act]');
  if (!btn) return;
  const act = tabBtn ? 'tab' : btn.dataset.act;
  if (act !== 'arm' && act !== 'rename') setArmed(null);
  if (!['record', 'arm'].includes(act)) ui.flash = '';
  const e = btn.dataset.scope === 'edit' ? ui.edit : ui.entry;
  switch (act) {
    case 'tab':
      ui.tab = btn.dataset.tab;
      ui.edit = null;
      ui.editMeta = null;
      if (ui.tab !== 'log') ui.viewId = null;
      break;
    case 'type':
      e.type = btn.dataset.t;
      e.tai = 0;
      e.tais = [0, 0, 0, 0];
      if (e.type !== 'ron' && e.type !== 'triple') e.loser = null;
      break;
    case 'triple':
      e.tai = 0;
      e.tais = [0, 0, 0, 0];
      e.type = e.type === 'triple' ? 'ron' : 'triple';
      if (e.type === 'triple') e.winner = null;
      break;
    case 'pick': {
      const p = Number(btn.dataset.p);
      e[btn.dataset.key] = e[btn.dataset.key] === p ? null : p;
      if (e.loser === e.winner) e.loser = null;
      break;
    }
    case 'swapPick':
      if (e && e.winner != null && e.loser != null) {
        const tmp = e.winner;
        e.winner = e.loser;
        e.loser = tmp;
      }
      break;
    case 'seatPick': pickSeat(Number(btn.dataset.p)); break;
    case 'editMeta': {
      const g = viewedGame();
      if (g) ui.editMeta = { loc: g.location || '', start: clock(startOf(g)) };
      break;
    }
    case 'fillLast': {
      const last = games.slice().sort(byNewest)[0];
      if (!last || !ui.draft) break;
      const seats = MJ.replayLineupSeats(last);
      ui.draft.names = seats.map((s) => s.members[0] || '');
      ui.draft.mates = seats.map((s) => s.members[1] || '');
      break;
    }
    case 'clearNames':
      if (ui.draft) { ui.draft.names = ['', '', '', '']; ui.draft.mates = ['', '', '', '']; }
      break;
    case 'chartBy': ui.chartBy = btn.dataset.v; break;
    case 'person': {
      const name = btn.closest('.lead-item').querySelector('.lead-name').textContent;
      ui.openPerson = ui.openPerson === name ? null : name;
      break;
    }
    case 'tai':
      if (btn.dataset.p != null) {
        const p = Number(btn.dataset.p);
        if (!e.tais) e.tais = [0, 0, 0, 0];
        e.tais[p] = Math.max(0, (e.tais[p] || 0) + Number(btn.dataset.d));
      } else {
        e.tai = Math.max(0, e.tai + Number(btn.dataset.d));
      }
      break;
    case 'taiset':
      if (btn.dataset.p != null) {
        const p = Number(btn.dataset.p);
        if (!e.tais) e.tais = [0, 0, 0, 0];
        e.tais[p] = Number(btn.dataset.n);
      } else {
        const g = btn.dataset.scope === 'edit' ? viewedGame() : activeGame();
        e.tai = Math.max(0, Number(btn.dataset.n) - selfExtra(g, e.type));
      }
      break;
    case 'record': {
      const g = activeGame();
      const hand = handFrom(ui.entry);
      if (!g || !hand) return;
      hand.t = Date.now();
      const ng = clone(g);
      ng.hands.push(hand);
      saveGame(ng);
      ui.flash = `已記錄第 ${ng.hands.length} 把`;
      ui.entry = newEntry('ron');
      break;
    }
    case 'edit': {
      const g = viewedGame();
      const i = Number(btn.dataset.i);
      const h = g && g.hands[i];
      if (!h) return;
      ui.tab = 'log';
      ui.edit = {
        index: i,
        fromTable: btn.dataset.from === 'table',
        type: h.type,
        winner: h.type === 'ron' || h.type === 'tsumo' ? h.winner : null,
        loser: h.type === 'ron' || h.type === 'triple' ? h.loser : null,
        tai: h.tai || 0,
        tais: h.tais ? h.tais.slice() : [0, 0, 0, 0],
      };
      render();
      const el = document.getElementById('editPanel');
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    case 'editSave': {
      const g = viewedGame();
      const hand = handFrom(ui.edit);
      if (!g || !hand) return;
      const back = ui.edit.fromTable;
      const ng = clone(g);
      hand.t = g.hands[ui.edit.index].t;
      ng.hands[ui.edit.index] = hand;
      saveGame(ng);
      ui.flash = `已修改第 ${ui.edit.index + 1} 把，後面都重算好了`;
      ui.edit = null;
      if (back) ui.tab = 'table';
      break;
    }
    case 'editCancel':
      if (ui.edit && ui.edit.fromTable) ui.tab = 'table';
      ui.edit = null;
      break;
    case 'seatOpen': {
      const r = MJ.replay(activeGame());
      ui.error = '';
      ui.seatPanel = btn.dataset.mode === 'swap'
        ? { mode: 'swap', seats: clone(r.lineup.seats), newNames: ['', '', '', ''] }
        : { mode: 'redraw', order: [0, 1, 2, 3], dealer: r.state.dealer };
      break;
    }
    case 'swapOn': {
      const sp = ui.seatPanel;
      const p = Number(btn.dataset.p);
      sp.seats[p].on = Number(btn.dataset.k);
      sp.newNames[p] = '';
      break;
    }
    case 'seatSave':
      if (saveSeats()) { ui.seatPanel = null; ui.error = ''; }
      break;
    case 'seatCancel': ui.seatPanel = null; ui.error = ''; break;
    case 'arm': {
      const key = btn.dataset.key;
      if (ui.armed === key) { setArmed(null); doArmed(key); } else setArmed(key);
      break;
    }
    case 'export':
      exportCsv();
      return;
    case 'newRoom': enterRoom(newRoomCode()); return;
    case 'joinRoom': {
      const code = (document.getElementById('joinLink').value.split('#')[1] || '').trim();
      if (validRoom(code)) { ui.error = ''; enterRoom(code); return; }
      ui.error = '這不是房間連結。完整的連結後面會有一個 # 和一長串英數字。';
      break;
    }
    case 'copyLink': copyLink(); return;
    case 'rename': doRename(); break;
    case 'saveLoc': {
      const g = viewedGame();
      if (!g) return;
      const ng = clone(g);
      ng.location = (ui.editMeta ? ui.editMeta.loc : document.getElementById('locEdit').value).trim();
      const hm = ui.editMeta ? ui.editMeta.start : document.getElementById('startEdit').value;
      if (/^\d\d:\d\d$/.test(hm)) {
        const d = new Date(g.createdAt);
        d.setHours(Number(hm.slice(0, 2)), Number(hm.slice(3)), 0, 0);
        const base = d.getTime();
        const day = 24 * 3600 * 1000;
        // 在前一天、當天、隔天三個同時刻候選裡，取不晚於第一把（沒記把則不超過建局後 12 小時）的最晚那個
        const ref = (g.hands.length && g.hands[0].t) || Math.min(Date.now(), g.createdAt + 12 * 3600 * 1000);
        const cands = [base - day, base, base + day].filter((t) => t <= ref);
        ng.startedAt = cands.length ? cands[cands.length - 1] : base - day;
      }
      saveGame(ng);
      ui.flash = '已儲存';
      ui.editMeta = null;
      break;
    }
    case 'open':
      ui.viewId = btn.dataset.id;
      ui.tab = 'log';
      ui.edit = null;
      ui.editMeta = null;
      break;
  }
  render();
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (!el.dataset) return;
  if (el.dataset.meta && ui.editMeta) {
    ui.editMeta[el.dataset.meta] = el.value;
    return;
  }
  if (el.dataset.rn) {
    ui.rename[el.dataset.rn] = el.value;
    // 改了輸入就要重新確認一次合併
    if (ui.armed === 'rename') { setArmed(null); render(); }
    return;
  }
  if (el.dataset.sp && ui.seatPanel) {
    const sp = ui.seatPanel;
    if (el.dataset.sp === 'newName') sp.newNames[Number(el.dataset.p)] = el.value;
    return;
  }
  if (!el.dataset.draft || !ui.draft) return;
  const d = ui.draft;
  const k = el.dataset.draft;
  if (k === 'name') {
    const i = Number(el.dataset.i);
    d.names[i] = el.value;
    // 「誰先當莊」的選項跟著名字即時更新，不用等整頁重畫
    const opt = document.querySelector(`#startDealer option[value="${i}"]`);
    if (opt) opt.textContent = W[i] + '位' + (el.value.trim() ? '（' + el.value.trim() + '）' : '');
  }
  else if (k === 'mate') d.mates[Number(el.dataset.i)] = el.value;
  else if (k === 'location') d.location = el.value;
  else if (k === 'startDealer') d.startDealer = Number(el.value);
  else if (k === 'base' || k === 'perTai') d[k] = Number(el.value);
  else d[k] = el.checked;
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.filter) { ui.filter[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.sp && ui.seatPanel) {
    const sp = ui.seatPanel;
    if (el.dataset.sp === 'order') sp.order[Number(el.dataset.k)] = Number(el.value);
    if (el.dataset.sp === 'dealer') sp.dealer = Number(el.value);
    render();
  }
});

document.addEventListener('submit', (ev) => {
  if (ev.target.id !== 'setup') return;
  ev.preventDefault();
  const d = ui.draft;
  const names = d.names.map((n) => n.trim());
  const mates = d.mates.map((n) => n.trim());
  const all = names.concat(mates.filter(Boolean));
  if (names.some((n) => !n)) ui.error = '四個位子都要填名字。';
  else if (new Set(all).size < all.length) ui.error = '名字不能重複，不然戰績會混在一起。';
  else if (!(d.base >= 0) || !(d.perTai >= 0)) ui.error = '底和每台要填 0 以上的數字。';
  else {
    ui.error = '';
    const t = Date.now();
    saveGame({
      id: 'g' + t.toString(36), createdAt: t, endedAt: null, location: (d.location || '').trim(),
      settings: { base: d.base, perTai: d.perTai, tsumoTai: d.tsumoTai, dealerTai: d.dealerTai, drawStreak: d.drawStreak },
      lineups: [{ from: 0, restart: true, dealer: d.startDealer, seats: names.map((n, i) => ({ members: mates[i] ? [n, mates[i]] : [n], on: 0 })) }],
      hands: [],
    });
    ui.draft = null;
    ui.entry = newEntry();
  }
  render();
});

// 加到主畫面的 App 會一直用舊的網頁，打開或切回來時看一下網站上的版本，不同就重新載入
const APP_VERSION = '202610191747';
async function checkUpdate() {
  try {
    const res = await fetch('./?check=' + Date.now(), { cache: 'no-store' });
    const m = (await res.text()).match(/APP_VERSION = '(\d+)'/);
    if (!m || m[1] === APP_VERSION) return;
    if (new URLSearchParams(location.search).get('v') === m[1]) return; // 已經試過一次就不再重來，避免一直重載
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    location.replace(location.pathname + '?v=' + m[1] + location.hash);
  } catch (e) { /* 沒網路就照用舊版 */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

boot();
checkUpdate();
